<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONLYSTYLE 业务管理系统</title>
  <link rel="stylesheet" href="css/style.css?v=20">
</head>
<body>
  <div id="app">
    <!-- 侧边导航 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <span id="sidebarLogo" class="logo-mark"><svg width="26" height="26" viewBox="0 0 48 48" fill="none" aria-hidden="true">
            <defs><linearGradient id="gBrand" x1="4" y1="44" x2="44" y2="4" gradientUnits="userSpaceOnUse">
              <stop stop-color="#1F5BFF"/><stop offset="1" stop-color="#3BE0FF"/></linearGradient></defs>
            <circle cx="24" cy="24" r="14.5" stroke="url(#gBrand)" stroke-width="2.2" opacity=".95"/>
            <ellipse cx="24" cy="24" rx="19.5" ry="8" transform="rotate(-36 24 24)" stroke="url(#gBrand)" stroke-width="1.3" opacity=".55"/>
            <ellipse cx="24" cy="24" rx="19.5" ry="8" transform="rotate(36 24 24)" stroke="url(#gBrand)" stroke-width="1.3" opacity=".3"/>
            <circle cx="36.4" cy="13.2" r="1.8" fill="#3BE0FF"/>
            <path d="M12.5 35.5 L35.5 12.5" stroke="#3BE0FF" stroke-width="2.6" stroke-linecap="round"/>
            <path d="M26 12.5 H35.5 V22" stroke="#3BE0FF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg></span>
          <div class="logo-text">
            <span class="logo-title" id="sidebarTitle">ONLY<span>STYLE</span></span>
            <span class="logo-sub" id="sidebarSub">Business OS</span>
          </div>
        </div>
      </div>

      <div class="sb-line-switch" id="bizLineSwitch" title="切换业务线（暂未开放）">
        <div>
          <div class="sb-ls-label">当前业务线</div>
          <div class="sb-ls-name"><i class="sb-ls-dot"></i><span id="bizLineName">宽带与 IT 服务</span></div>
        </div>
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M4 6.5l4 4 4-4" stroke="rgba(255,255,255,.5)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>

      <nav class="nav-menu">
        <a href="#" class="nav-item active" data-page="dashboard">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          <span>数据看板</span>
        </a>

        <div class="nav-group-h">业务管理</div>

        <a href="#" class="nav-item" data-page="customers">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
          <span>客户管理</span>
        </a>
        <a href="#" class="nav-item" data-page="contracts">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          <span>合同管理</span>
        </a>

        <div class="nav-group-h">资源台账</div>

        <a href="#" class="nav-item" data-page="suppliers">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 5.5L8 2l6 3.5v5L8 14l-6-3.5v-5z"/><path d="M2 5.5L8 9l6-3.5M8 9v5"/></svg>
          <span>资源管理</span>
        </a>
        <a href="#" class="nav-item" data-page="spatial">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>项目管理</span>
        </a>

        <div class="nav-group" id="contentGroup">
          <div class="nav-group-toggle" data-group="content">
            <span>增长与内容</span>
            <svg class="nav-arrow" id="contentArrow" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
          </div>
          <div class="nav-submenu" id="contentMenu">
            <div>
              <a href="#" class="nav-subitem" data-page="content" data-tab="home">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg>
                首页布局
              </a>
              <a href="#" class="nav-subitem" data-page="content" data-tab="site">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/></svg>
                站点配置
              </a>
              <a href="#" class="nav-subitem" data-page="content" data-tab="catalog">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
                服务与行业
              </a>
              <a href="#" class="nav-subitem" data-page="content" data-tab="cases">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/></svg>
                案例
              </a>
            </div>
          </div>
        </div>

        <div class="nav-group" id="settingsGroup">
          <div class="nav-group-toggle" data-group="settings">
            <span>系统</span>
            <svg class="nav-arrow" id="settingsArrow" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
          </div>
          <div class="nav-submenu" id="settingsMenu">
            <div>
              <a href="#" class="nav-subitem" data-page="settings" data-tab="dept">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
                组织架构
              </a>
              <a href="#" class="nav-subitem" data-page="settings" data-tab="general">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                常规配置
              </a>
              <a href="#" class="nav-subitem" data-page="settings" data-tab="wechat">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
                微信配置
              </a>
              <a href="#" class="nav-subitem" data-page="settings" data-tab="biz">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
                业务配置
              </a>
            </div>
          </div>
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="user-info" id="userInfo" style="display:none">
          <div class="user-avatar" id="userAvatar">A</div>
          <div class="user-detail">
            <span class="user-name" id="userName">用户</span>
            <span class="user-role" id="userRole">角色</span>
          </div>
          <button class="btn-logout" onclick="logout()" title="退出登录">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main-content">
      <header class="top-bar">
        <div class="top-bar-left">
          <button class="btn-sidebar-toggle" onclick="toggleSidebar()" title="折叠/展开侧边栏">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div class="crumb">
            <span id="crumbRoot">数据看板</span>
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M6 3.5l4.5 4.5L6 12.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <b class="page-title" id="pageTitle">数据看板</b>
          </div>
        </div>

        <div class="tb-search">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.6" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <input id="globalSearch" type="search" placeholder="筛选当前页表格…" autocomplete="off">
        </div>

        <button class="tb-ico" onclick="runReminderNow()" title="运行提醒引擎">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 2.2a4.6 4.6 0 00-4.6 4.6v3L3.2 12.3h11.6l-1.2-2.5v-3A4.6 4.6 0 009 2.2z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M7.2 14.2a1.9 1.9 0 003.6 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span class="dot" id="reminderDot"></span>
        </button>

        <div class="status-chip">
          <span class="status-dot" id="statusDot"></span>
          <span class="status-text" id="statusText">系统在线</span>
        </div>

        <div class="tb-user" id="topUser" style="display:none">
          <div class="user-avatar" id="topAvatar">A</div>
          <div class="tb-user-name" id="topUserName">用户</div>
        </div>
      </header>

      <div class="content-body" id="contentBody">
        <!-- 动态内容由 JS 渲染 -->
      </div>
    </main>
  </div>

  <!-- Modal -->
  <div class="modal-backdrop" id="modalBackdrop" onclick="closeModal()"></div>
  <div class="modal" id="modal">
    <div class="modal-header">
      <h3 class="modal-title" id="modalTitle">表单</h3>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>

  <!-- Alert/Confirm Dialog -->
  <div class="dialog-backdrop" id="dialogBackdrop"></div>
  <div class="dialog" id="dialog">
    <div class="dialog-header">
      <h3 class="dialog-title" id="dialogTitle">提示</h3>
    </div>
    <div class="dialog-body" id="dialogBody"></div>
    <div class="dialog-footer" id="dialogFooter"></div>
  </div>

  <!-- 登录遮罩 -->
  <div class="login-overlay" id="loginOverlay">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo" id="loginLogo">
          <svg width="26" height="26" viewBox="0 0 48 48" fill="none" aria-hidden="true">
            <defs><linearGradient id="gLogin" x1="4" y1="44" x2="44" y2="4" gradientUnits="userSpaceOnUse">
              <stop stop-color="#1F5BFF"/><stop offset="1" stop-color="#3BE0FF"/></linearGradient></defs>
            <circle cx="24" cy="24" r="14.5" stroke="url(#gLogin)" stroke-width="2.2"/>
            <ellipse cx="24" cy="24" rx="19.5" ry="8" transform="rotate(-36 24 24)" stroke="url(#gLogin)" stroke-width="1.3" opacity=".55"/>
            <circle cx="36.4" cy="13.2" r="1.8" fill="#3BE0FF"/>
            <path d="M12.5 35.5 L35.5 12.5" stroke="#3BE0FF" stroke-width="2.6" stroke-linecap="round"/>
            <path d="M26 12.5 H35.5 V22" stroke="#3BE0FF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>
        </div>
        <h2 id="loginTitle">ONLYSTYLE 业务管理系统</h2>
        <p id="loginSubtitle">Business OS</p>
      </div>
      <form id="loginForm" onsubmit="return false" class="login-form">
        <div class="login-field">
          <label>账号</label>
          <input name="username" type="text" placeholder="请输入账号" value="admin" autocomplete="username">
          <span class="login-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </span>
        </div>
        <div class="login-field">
          <label>密码</label>
          <input name="password" type="password" placeholder="请输入密码" value="admin123" autocomplete="current-password">
          <span class="login-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          </span>
        </div>
        <div class="login-error" id="loginError"></div>
        <button class="login-btn" type="button" onclick="doLogin()">登 录</button>
      </form>
      <div class="login-footer">&copy; 2026 ONLYSTYLE · Business OS</div>
    </div>
  </div>

  <script src="js/api.js?v=8"></script>
  <script src="js/pages/dashboard.js?v=8"></script>
  <script src="js/pages/suppliers.js?v=6"></script>
  <script src="js/pages/spatial.js?v=4"></script>
  <script src="js/pages/customers.js?v=10"></script>
  <script src="js/pages/contracts.js?v=11"></script>
  <script src="js/pages/departments.js?v=1"></script>
  <script src="js/pages/staff.js?v=2"></script>
  <script src="js/pages/content.js?v=2"></script>
  <script src="js/pages/settings.js?v=18"></script>
  <script src="js/app.js?v=9"></script>
</body>
</html>
