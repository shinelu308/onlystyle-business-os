# =============================================================================
#  ONLYSTYLE 官网 · www.onlystyle.com.cn  →  应用服务器 :8085
# -----------------------------------------------------------------------------
#  放置位置：/etc/nginx/conf.d/www.onlystyle.com.cn.conf
#
#  路由规则（关键）：
#    /api/     → onlystyle_api (3100)   官网要读内容中台的公开接口
#    /uploads/ → onlystyle_api (3100)   品牌 logo / 证书图 / 设备图都挂在这里
#    /media/   → onlystyle_web (8085)   星球贴图等构建期静态素材（走静态站更快）
#    /         → onlystyle_web (8085)   SPA 页面（404 回退由 serve.cjs 负责）
#
#  ℹ️ 8085（pm2 onlystyle-web = website/serve.cjs）**自己也会**把 /api 与 /uploads
#     反代到 3100，所以即使这里不写 /api，域名也能正常显示内容。
#     保留这两条的价值：少一跳（Nginx 直连后端），且 8085 重启的瞬间接口仍可用。
#  ⚠️ 反过来说，千万**不要**把 /api 指到只做静态的端口 —— 那样官网会「壳出来但内容旧」。
# =============================================================================

server {
    listen      80;
    listen      [::]:80;
    server_name www.onlystyle.com.cn onlystyle.com.cn;

    # 证书图片走 base64 提交（后端 json 上限 16m，base64 后约 10.7MB），
    # 这里必须比它宽，否则在到达后端之前就被 nginx 413 掉。
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://onlystyle_api;
        include /etc/nginx/onlystyle-proxy.inc;
    }

    location /uploads/ {
        proxy_pass http://onlystyle_api;
        include /etc/nginx/onlystyle-proxy.inc;
    }

    location /media/ {
        proxy_pass http://onlystyle_web;
        include /etc/nginx/onlystyle-proxy.inc;
    }

    location / {
        proxy_pass http://onlystyle_web;
        include /etc/nginx/onlystyle-proxy.inc;
    }
}
