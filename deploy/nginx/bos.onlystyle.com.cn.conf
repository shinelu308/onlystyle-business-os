# =============================================================================
#  ONLYSTYLE 后台 · bos.onlystyle.com.cn  →  应用服务器 :3100
# -----------------------------------------------------------------------------
#  放置位置：/etc/nginx/conf.d/bos.onlystyle.com.cn.conf
#
#  后台是「后端同源全量」：HTML/JS 静态页 + /api/* + /uploads/* + /media/*+
#  全部由 Express（3100）直接提供，所以这里 location / 一把梭即可。
#
#  ⚠️ 微信 OAuth 回调地址填的就是 https://bos.onlystyle.com.cn/wechat/callback，
#     改域名/改这里时记得同步 system_settings.wechat_redirect_uri。
# =============================================================================

server {
    listen      80;
    listen      [::]:80;
    server_name bos.onlystyle.com.cn;

    client_max_body_size 25m;

    location / {
        proxy_pass http://onlystyle_api;
        include /etc/nginx/onlystyle-proxy.inc;
    }
}
