# =============================================================================
#  ONLYSTYLE · Nginx upstream 定义（放在**代理服务器**上）
# -----------------------------------------------------------------------------
#  放置位置：/etc/nginx/conf.d/00-onlystyle-upstream.conf
#
#  🔴 把 __APP_HOST__ 换成「应用服务器」的地址：
#     · 同内网/VPC  → 内网 IP（推荐，如 10.0.0.12；这样 3100 完全不必对公网开放）
#     · 跨公网      → 公网 IP（此时必须用云安全组把 3100/8085 限制为只允许本代理机）
#
#  两个进程都由 pm2 托管：
#     onlystyle-api  → __APP_HOST__:3100   （Express：API + 后台 + /uploads /media）
#     onlystyle-web  → __APP_HOST__:8085   （官网静态站，SPA）
# =============================================================================

upstream onlystyle_api {
    server __APP_HOST__:3100 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream onlystyle_web {
    server __APP_HOST__:8085 max_fails=3 fail_timeout=10s;
    keepalive 32;
}
